name: Build Comix2 Extension

on:
  push:
    branches: [comix2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply Spotless Formatting
        run: ./gradlew spotlessApply
      - name: Build with Gradle
        run: ./gradlew :src:en:comix2:assembleRelease
      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comix2-artifacts
          path: |
            src/en/comix2/build/outputs/jar/release/*.jar
            src/en/comix2/build/outputs/apk/release/*.apk
